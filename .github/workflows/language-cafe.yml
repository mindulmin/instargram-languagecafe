name: Language Cafe scheduled publisher

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Seoul; GitHub scheduling may be delayed.
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight: infrastructure; controller-preview: select only; publish: full workflow; reconcile: verify existing pair and unattempted Story'
        type: choice
        options: [preflight, controller-preview, publish, reconcile, complete-story]
        default: preflight

concurrency:
  group: language-cafe-publisher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publisher:
    if: github.repository == 'mindulmin/instargram-languagecafe' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write # Atomic encrypted checkpoints on the cloud-state branch.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source in the isolated checkout
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:cloud
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Cloudflare project access without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloud/check-cloudflare.cjs
      - name: Verify Cloudflare CLI runtime without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloud/check-cloudflare-cli.cjs
      - name: Verify native Codex executable before claiming any publication
        run: |
          # Node child_process.spawn cannot launch the npm codex.cmd shim on Windows.
          # Keep the official action, but give its child process an actual codex.exe.
          $nativeRoot = Join-Path $env:RUNNER_TEMP 'language-cafe-codex'
          npm install --prefix $nativeRoot --no-audit --no-fund @openai/codex@0.154.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativeExecutables = @(Get-ChildItem -LiteralPath $nativeRoot -Recurse -File -Filter codex.exe)
          if ($nativeExecutables.Count -ne 1) { throw 'Expected exactly one native Codex executable' }
          $nativeDirectory = $nativeExecutables[0].DirectoryName
          $env:PATH = "$nativeDirectory;$env:PATH"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nativeDirectory
          node -e "const r=require('node:child_process').spawnSync('codex',['--version'],{encoding:'utf8'}); if(r.error||r.status!==0) throw Error('Native Codex spawn failed'); console.log(r.stdout.trim());"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore state and run the cloud content controller
        id: prepare
        if: inputs.mode != 'reconcile' && inputs.mode != 'complete-story'
        env:
          GH_TOKEN: ${{ github.token }}
          LANGUAGE_CAFE_STATE_KEY: ${{ secrets.LANGUAGE_CAFE_STATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          THREADS_SESSION_JSON: ${{ secrets.THREADS_SESSION_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RUN_MODE: ${{ inputs.mode || 'publish' }}
        run: node cloud/runner.cjs prepare
      - name: Reconcile existing pair without repeating either post
        if: inputs.mode == 'reconcile' || inputs.mode == 'complete-story'
        env:
          RUN_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          LANGUAGE_CAFE_STATE_KEY: ${{ secrets.LANGUAGE_CAFE_STATE_KEY }}
          INSTAGRAM_SESSION_JSON: ${{ secrets.INSTAGRAM_SESSION_JSON }}
          THREADS_SESSION_JSON: ${{ secrets.THREADS_SESSION_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloud/runner.cjs reconcile
      - name: Install publisher runtime
        if: steps.prepare.outputs.run_agent == 'true'
        working-directory: C:\Users\earth\OneDrive\Desktop\codex\instagram-card-test\meaning-switch-series-v1
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r cloud/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Produce and publish one authorized learning pair
        id: agent
        if: steps.prepare.outputs.run_agent == 'true'
        uses: openai/codex-action@v1
        env:
          LANGUAGE_CAFE_CLOUD: '1'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: language-cafe-instagram-assets
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.154.0'
          prompt-file: cloud/publisher-prompt.md
          output-file: cloud/results/agent-summary.md
          working-directory: C:\Users\earth\OneDrive\Desktop\codex\instagram-card-test\meaning-switch-series-v1
          safety-strategy: unsafe # Required by the official action on a fresh Windows VM.
          sandbox: danger-full-access
      - name: Checkpoint outcomes or retain the unresolved lock
        if: always() && steps.prepare.outputs.run_agent == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LANGUAGE_CAFE_STATE_KEY: ${{ secrets.LANGUAGE_CAFE_STATE_KEY }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node cloud/runner.cjs finalize
      - name: Preserve the compact run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-cafe-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cloud/results/cloudflare-check.json
            cloud/results/preflight.json
            cloud/results/controller.json
            cloud/results/growth-insights.json
            cloud/results/story.json
            cloud/results/checkpoint.json
          if-no-files-found: ignore
          retention-days: 30
